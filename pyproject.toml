[project]
name = "my-llm-test-framework"
version = "0.1.0"
description = "Playwright + Ollama framework for testing LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright",
    "pytest",
    "requests",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["framework"]